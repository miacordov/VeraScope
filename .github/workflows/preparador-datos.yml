name: Preparador de datos

on:
  pull_request:
    paths:
      - "backend/verascope_datos/**"
      - ".github/workflows/preparador-datos.yml"
  push:
    branches: [main]
    paths:
      - "backend/verascope_datos/**"
      - ".github/workflows/preparador-datos.yml"

permissions:
  contents: read

jobs:
  pruebas:
    name: pytest del preparador (sin internet)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend/verascope_datos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/verascope_datos/pyproject.toml
      - name: Instalar
        run: python -m pip install -e ".[pruebas]"
      - name: Probar
        run: python -m pytest tests -q
