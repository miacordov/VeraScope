[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "verascope-datos"
version = "1.1.0"
description = "Cargador de datos de VeraScope: baja, ordena, calcula y empaqueta las 13 variables"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26", "pandas>=2.1", "pyarrow>=14", "scipy>=1.11", "pymannkendall>=1.4",
  "requests>=2.31", "rich>=13", "xarray>=2024.1", "h5netcdf>=1.3", "h5py>=3.10", "earthaccess>=0.9",
  "cftime>=1.6",  # GPM y AppEEARS fechan con calendario julian
]

[project.optional-dependencies]
pruebas = ["pytest>=8"]

[project.scripts]
verascope-datos = "verascope_datos.cli:main"

[tool.setuptools]
packages = ["verascope_datos", "verascope_datos.fuentes", "verascope_datos.panel"]

[tool.setuptools.package-data]
"verascope_datos.panel" = ["pagina.html", "tierra.txt", "logo.svg", "fuentes.css"]
